name: Monthly data refresh

# Re-downloads every source, rebuilds the analysis and site (which stamps the new
# "Pantry data as of" date), commits the result to main and deploys to Cloudflare Pages.
# If any check or headline assertion fails, the job fails before committing or deploying,
# so the live site keeps the last good build.

on:
  schedule:
    - cron: "0 13 5 * *" # 5th of each month, 13:00 UTC (8am Central)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Fetch photos (not part of `make fetch`)
        run: cd fetch && uv run --frozen python -W ignore fetch_photos.py

      - name: Re-download every source, run analysis + checks, rebuild site
        run: make refresh

      - name: Rebuild the brief PDF (headless Chrome)
        run: node tools/pdf.mjs site/brief/index.html site/brief/tulsa-pantry-gap-brief.pdf 2

      - name: Commit refreshed data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived site
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy site --project-name tulsa-pantry-gap --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
